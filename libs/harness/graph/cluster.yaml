version: 1
metadata:
  name: harness
state:
  backend: cluster
  lock: true
providers:
  embedding:
    local-ollama:
      base_url: http://127.0.0.1:11434/v1
      model: nomic-embed-text
      api_key: ${OMNIGRAPH_EMBEDDING_API_KEY}
policies:
  graph-access:
    file: graph.policy.yaml
    applies_to: [harness]
  workflow-access:
    file: workflows.policy.yaml
    applies_to: [harness-workflows]
graphs:
  harness:
    schema: schema.pg
    queries: queries/
    embedding_provider: local-ollama
  harness-workflows:
    schema: workflows.schema.pg
    queries: workflow-queries/
